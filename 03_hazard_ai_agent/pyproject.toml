[project]
name = "thanphai-hazard-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["thanphai-shared", "thanphai-geo-integration", "thanphai-decision"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hazard_agent*"]
