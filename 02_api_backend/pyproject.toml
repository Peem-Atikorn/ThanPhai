[project]
name = "thanphai-api-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "thanphai-shared",
    "thanphai-external-data",
    "thanphai-geo-integration",
    "thanphai-risk-models",
    "thanphai-decision",
    "thanphai-hazard-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api_backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
