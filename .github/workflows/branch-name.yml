# Branch naming rule for the team (see README "Team workflow").
#   <type>/<module>-<short-topic>
#   type:   feature | fix | hotfix | docs | refactor | test | chore
#   module: 01-08 for one module, 00 for shared/infra, all for the whole project
#   topic:  lowercase English words joined by "-"
# Examples: feature/08-line-alerts, fix/04-tmd-empty-stations, docs/all-setup-guide
# Pull requests into main may come only from develop or hotfix/*.
name: branch-name

on:
  push:
    branches-ignore: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
        run: |
          pattern='^(feature|fix|hotfix|docs|refactor|test|chore)/(0[0-8]|all)-[a-z0-9]+(-[a-z0-9]+)*$'
          if [ "$BRANCH" != "develop" ] && ! [[ "$BRANCH" =~ $pattern ]]; then
            echo "::error::Branch '$BRANCH' does not follow <type>/<module>-<topic>, e.g. feature/08-line-alerts or fix/04-tmd-empty-stations"
            exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$BRANCH" != "develop" ] && [[ "$BRANCH" != hotfix/* ]]; then
            echo "::error::Only develop or hotfix/* may be merged into main (got '$BRANCH'). Open the pull request into develop."
            exit 1
          fi
          echo "Branch name OK: $BRANCH"
