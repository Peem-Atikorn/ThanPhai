[project]
name = "thanphai-geo-integration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["thanphai-shared", "geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0", "pyproj>=3.6", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geo_integration*"]
