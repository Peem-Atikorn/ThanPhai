# Alert-level rules for ThanPhai. Change only through review: bump `version` and add test cases.
# Final level = max(official warning, safety overrides, model level). Degraded data never lowers a level.
version: "2026.10.22.2"

official_warning:
  # An active official warning for the hazard sets this minimum level.
  min_level: WARNING

# Observation thresholds. A rule fires when `value <op> threshold`. Rules for the same hazard
# are all checked and the highest level wins.
overrides:
  flood:
    - id: FLOOD_ABOVE_BANK_HIGH
      variable: above_bank_m          # metres above the lowest bank (ThaiWater, sign rebuilt)
      op: ">="
      threshold: 0.5
      level: CRITICAL
    - id: FLOOD_ABOVE_BANK
      variable: above_bank_m
      op: ">"
      threshold: 0.0
      level: WARNING
    - id: FLOOD_NEAR_BANK
      variable: above_bank_m
      op: ">="
      threshold: -0.3
      level: WATCH
    # GISTDA Sentinel-1 flood cells (H3, ~0.12 km2 each) seen in the district during the last 7 days.
    # Placeholder thresholds: any detection = WATCH, >= 1,000 cells (~125 km2) = WARNING. Tune with module 06.
    - id: SAT_FLOOD_7D_LARGE
      variable: satellite_flood_cells_7d
      op: ">="
      threshold: 1000
      level: WARNING
    - id: SAT_FLOOD_7D
      variable: satellite_flood_cells_7d
      op: ">="
      threshold: 1
      level: WATCH
  rain_storm:
    # TMD criteria: heavy 35.1–90 mm/day, very heavy > 90 mm/day.
    - id: RAIN_VERY_HEAVY_24H
      variable: rain_24h
      op: ">"
      threshold: 90.0
      level: WARNING
    - id: RAIN_HEAVY_24H
      variable: rain_24h
      op: ">="
      threshold: 35.1
      level: WATCH
    # Forecast rain for one day (TMD NWP / WRF), same TMD thresholds. Decided per forecast day.
    - id: RAIN_FORECAST_VERY_HEAVY
      variable: forecast_rain_24h
      op: ">"
      threshold: 90.0
      level: WARNING
    - id: RAIN_FORECAST_HEAVY
      variable: forecast_rain_24h
      op: ">="
      threshold: 35.1
      level: WATCH
  drought:
    # Standard SPI classes: moderate -1.0, severe -1.5, extreme -2.0.
    - id: DROUGHT_SPI3_EXTREME
      variable: spi_3
      op: "<="
      threshold: -2.0
      level: CRITICAL
    - id: DROUGHT_SPI3_SEVERE
      variable: spi_3
      op: "<="
      threshold: -1.5
      level: WARNING
    - id: DROUGHT_SPI3_MODERATE
      variable: spi_3
      op: "<="
      threshold: -1.0
      level: WATCH
    # Vegetation stress from MODIS NDVI. Vegetation alone gives at most WATCH: a higher drought level needs a
    # rainfall deficit (SPI) to confirm it. HazardService passes vci only where NDVI is >= 0.05 below normal,
    # the district is not mostly urban (NDVI max >= 0.6) and no flood was seen (water also lowers NDVI).
    - id: DROUGHT_VCI_STRESS
      variable: vci
      op: "<"
      threshold: 35
      level: WATCH
    - id: DROUGHT_NDVI_DEFICIT_LARGE
      variable: ndvi_deficit
      op: ">="
      threshold: 0.15
      level: WATCH
  fire:
    # Placeholder thresholds per district; tune with module 06 after evaluation.
    - id: FIRE_HOTSPOTS_24H_HIGH
      variable: hotspots_24h
      op: ">="
      threshold: 10
      level: WARNING
    - id: FIRE_HOTSPOTS_24H
      variable: hotspots_24h
      op: ">="
      threshold: 3
      level: WATCH
  air_quality:
    # PM2.5 24-hour average, Pollution Control Department bands (since 2023-06-01): 37.6–75 "starts to
    # affect health" (orange), >= 75.1 "affects health" (red). PCD has no higher band, so no CRITICAL rule.
    - id: PM25_UNHEALTHY
      variable: pm25_24h
      op: ">="
      threshold: 75.1
      level: WARNING
    - id: PM25_STARTS_AFFECTING
      variable: pm25_24h
      op: ">="
      threshold: 37.6
      level: WATCH
    # CAMS model forecast (Open-Meteo), mean of the next 24 h at the district centre. HazardService passes it
    # only for districts without an Air4Thai station. Model alone gives at most WATCH until it is checked
    # against the stations.
    - id: PM25_MODEL_STARTS_AFFECTING
      variable: pm25_model_24h
      op: ">="
      threshold: 37.6
      level: WATCH
  heat:
    # Heat index (NOAA formula from forecast temperature and humidity), highest of the next 24 h.
    # TMD/BMA bands: 27–32.9 เฝ้าระวัง, 33–41.9 เตือนภัย, 42–51.9 อันตราย, >= 52 อันตรายมาก. The lowest band covers
    # almost every Thai afternoon, so levels follow severity one step down: TMD เตือนภัย -> WATCH,
    # อันตราย -> WARNING, อันตรายมาก -> CRITICAL. The UI also shows TMD's own label next to the value.
    - id: HEAT_INDEX_EXTREME_DANGER
      variable: heat_index_max_24h
      op: ">="
      threshold: 52.0
      level: CRITICAL
    - id: HEAT_INDEX_DANGER
      variable: heat_index_max_24h
      op: ">="
      threshold: 42.0
      level: WARNING
    - id: HEAT_INDEX_EXTREME_CAUTION
      variable: heat_index_max_24h
      op: ">="
      threshold: 33.0
      level: WATCH

confidence:
  official: 0.95
  override: 0.9
  # Multiplier applied when any input is stale or a service is degraded.
  degraded_factor: 0.6
