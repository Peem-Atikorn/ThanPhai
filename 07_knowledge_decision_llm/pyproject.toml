[project]
name = "thanphai-decision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["thanphai-shared", "pyyaml>=6", "google-genai>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decision_engine*"]

[tool.setuptools.package-data]
decision_engine = ["rules.yaml"]
